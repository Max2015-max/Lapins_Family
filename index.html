<!DOCTYPE html>

<title>Генеалогическое дерево семьи Лапиных</title>

<style>

body{
background:#efe4c8;
font-family:Georgia;
padding:30px;
}

h1{

}

text-align:center;

}

#tree{

}

.person:hover{

color:#5c4023;
}
