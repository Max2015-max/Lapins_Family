    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #efe4c8;
            font-family: Georgia, "Times New Roman", serif;
            color: #4b2d14;
            padding: 35px 20px;
            overflow-x: auto;
        }

        body.modal-open {
            overflow: hidden;
        }

            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 45px;
            color: #8b5a2b;
            font-weight: normal;
        }

        /*
        ==================================================
        ГЕНЕАЛОГИЧЕСКОЕ ДЕРЕВО
        ==================================================
        */

        .tree-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 10px 0 25px;
        }

        .tree {
            display: flex;
            justify-content: center;
            width: max-content;
            min-width: 100%;
            padding: 0 20px;
        }

        .tree ul {
            position: relative;
            display: flex;
            justify-content: center;
            padding-top: 25px;
        }

        .tree li {
            position: relative;
            list-style: none;
            text-align: center;
            padding: 20px 8px 0;
        }

        .tree li::before,
        .tree li::after {
            content: "";
            position: absolute;
            top: 0;
            right: 50%;
            width: 50%;
            height: 25px;
            border-top: 2px solid #8b6d45;
        }

        .tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid #8b6d45;
        }

        .tree li:only-child::before,
        .tree li:only-child::after {
            display: none;
        }

        .tree li:only-child {
            padding-top: 0;
        }

        .tree li:first-child::before {
            border: none;
        }

        .tree li:last-child::after {
            border: none;
        }

        .tree li:last-child::before {
            border-right: 2px solid #8b6d45;
            border-radius: 0 8px 0 0;
        }

        .tree li:first-child::after {
            border-radius: 8px 0 0 0;
        }

        .tree ul ul::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 0;
            height: 25px;
            border-left: 2px solid #8b6d45;
        }

        .person {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 175px;
            min-height: 43px;
            padding: 9px 15px;

            background: #f9efd8;
            border: 2px solid #8b6d45;
            border-radius: 10px;

            color: #4b2d14;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            text-align: center;

            cursor: pointer;
            transition:
                transform 0.2s,
                background 0.2s,
                box-shadow 0.2s;
        }

        .person:hover,
        .person:focus-visible {
            background: #fff8e9;
            transform: scale(1.04);
            box-shadow: 0 5px 14px rgba(75, 45, 20, 0.25);
            outline: none;
        }

        .person.has-biography::after {
            content: "●";
            margin-left: 8px;
            color: #8b5a2b;
            font-size: 8px;
        }

        /*
        ==================================================
        МОДАЛЬНОЕ ОКНО БИОГРАФИИ
        ==================================================
        */

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;

            display: none;

            background: rgba(32, 20, 10, 0.68);
            backdrop-filter: blur(2px);
        }

        #overlay.open {
            display: block;
        }

        #biography-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 9999;

            display: none;

            width: min(960px, calc(100vw - 28px));
            max-height: calc(100vh - 28px);

            transform: translate(-50%, -50%);
            overflow: hidden;

            background: #fffaf0;
            border: 3px solid #8b6d45;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        #biography-modal.open {
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;

            flex-shrink: 0;
            padding: 17px 20px;

            background: #f9efd8;
            border-bottom: 2px solid #8b6d45;
        }

        #person-name {
            margin: 0;
            font-size: 28px;
            line-height: 1.25;
        }

        #close-modal {
            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: #8b6d45;
            color: #ffffff;

            font-size: 28px;
            line-height: 1;

            cursor: pointer;
            transition: background 0.2s;
        }

        #close-modal:hover,
        #close-modal:focus-visible {
            background: #60401f;
            outline: none;
        }

        .modal-body {
            display: grid;
            grid-template-columns: minmax(220px, 310px) minmax(0, 1fr);
            gap: 27px;

            padding: 24px;
            overflow-y: auto;
        }

        .photo-column {
            min-width: 0;
        }

        #person-photo {
            display: none;

            width: 100%;
            max-height: 520px;

            object-fit: contain;

            background: #efe4c8;
            border: 2px solid #8b6d45;
            border-radius: 11px;
        }

        #photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 250px;
            padding: 25px;

            background: #f2e7cc;
            border: 2px dashed #a68760;
            border-radius: 11px;

            color: #806447;
            font-size: 17px;
            text-align: center;
        }

        .biography-column {
            min-width: 0;
        }

        #person-years {
            margin-bottom: 15px;
            color: #8b5a2b;
            font-size: 20px;
            font-weight: bold;
        }

        #person-biography {
            color: #4b2d14;
            font-size: 17px;
            line-height: 1.68;
            text-align: left;
        }

        #person-biography p {
            margin-bottom: 15px;
        }

        #person-biography p:last-child {
            margin-bottom: 0;
        }

        footer {
            margin-top: 50px;
            padding-top: 24px;
            border-top: 2px solid #8b6d45;

            color: #6b4a2d;
            font-size: 17px;
            line-height: 1.8;
            text-align: center;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 12px;
            }

            h1 {
                font-size: 33px;
            }

            h2 {
                margin-bottom: 30px;
                font-size: 18px;
            }

                max-height: calc(100vh - 14px);
                border-width: 2px;
            }

            .modal-header {
                padding: 13px 14px;
            }

            }

            }

                min-height: 180px;
            }

                font-size: 18px;
            }

                font-size: 16px;
            }
        }
    </style>

        const modal = document.getElementById("biography-modal");
        const overlay = document.getElementById("overlay");
        const closeModalButton = document.getElementById("close-modal");

        const personName = document.getElementById("person-name");
        const personYears = document.getElementById("person-years");
        const personBiography = document.getElementById("person-biography");

        const personPhoto = document.getElementById("person-photo");
        const photoPlaceholder = document.getElementById("photo-placeholder");


        function openBiography(personId) {

            const person = biographies[personId];

            if (!person) {
                return;
            }

            personName.textContent = person.name || "";
            personYears.textContent = person.years || "";
            personBiography.innerHTML = person.text || `
                <p>
                    Подробные биографические сведения
                    пока не добавлены.
                </p>
            `;

            if (person.photo) {

                personPhoto.src = person.photo;
                personPhoto.alt = "Фотография — " + person.name;

                personPhoto.style.display = "block";
                photoPlaceholder.style.display = "none";

            } else {

                personPhoto.removeAttribute("src");
                personPhoto.alt = "";

                personPhoto.style.display = "none";
                photoPlaceholder.style.display = "flex";

            }

            personPhoto.onerror = function () {

                personPhoto.style.display = "none";
                photoPlaceholder.style.display = "flex";

            };

            overlay.classList.add("open");
            modal.classList.add("open");
            document.body.classList.add("modal-open");

            closeModalButton.focus();
        }


        function closeBiography() {

            overlay.classList.remove("open");
            modal.classList.remove("open");
            document.body.classList.remove("modal-open");

        }


        document.querySelectorAll(".person").forEach(function (button) {

            button.addEventListener("click", function () {

                const personId = button.dataset.person;

                openBiography(personId);

            });

        });


        closeModalButton.addEventListener("click", closeBiography);


        overlay.addEventListener("click", closeBiography);


        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {
                closeBiography();
            }

        });

    </script>
