<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Семья Лапиных XIX-XXI век</title>

<style>

body{
background:#efe4c8;
font-family:Georgia;
margin:0;
padding:30px;
text-align:center;
}

h1{
color:#4b2d14;
margin-bottom:5px;
}

h2{
color:#6b4a2d;
margin-bottom:40px;
}

.tree ul{
padding-top:20px;
position:relative;
display:flex;
justify-content:center;
}

.tree li{
list-style-type:none;
position:relative;
padding:20px 5px 0 5px;
text-align:center;
}

.tree li::before,
.tree li::after{
content:'';
position:absolute;
top:0;
right:50%;
border-top:2px solid #8b6a46;
width:50%;
height:20px;
}

.tree li::after{
right:auto;
left:50%;
border-left:2px solid #8b6a46;
}

.tree li:only-child::after,
.tree li:only-child::before{
display:none;
}

.tree li:only-child{
padding-top:0;
}

.tree li:first-child::before,
.tree li:last-child::after{
border:none;
}

.tree li:last-child::before{
border-right:2px solid #8b6a46;
border-radius:0 5px 0 0;
}

.tree li:first-child::after{
border-radius:5px 0 0 0;
}

.tree ul ul::before{
content:'';
position:absolute;
top:0;
left:50%;
border-left:2px solid #8b6a46;
width:0;
height:20px;
}

.person{
display:inline-block;
padding:10px 15px;
border:2px solid #8b6a46;
border-radius:10px;
background:#f7edd6;
color:#4b2d14;
font-weight:bold;
box-shadow:2px 2px 10px rgba(0,0,0,.2);
transition:.3s;
}

.person:hover{
transform:scale(1.05);
}

small{
display:block;
margin-top:5px;
font-weight:normal;
}

</style>
</head>
